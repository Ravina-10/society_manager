<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Martand Niwas Society Maintenance Management Web App">

  <!-- No Cache headers to prevent stale ServiceWorker delays -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Martand Niwas Society">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Martand Niwas Society</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4fbf9;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      background-color: #004D40;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #FFD700;
      font-size: 44px;
      font-weight: 900;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 12px rgba(0, 77, 64, 0.25);
      margin-bottom: 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E0F2F1;
      border-top-color: #004D40;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 20px;
      font-weight: bold;
      color: #004D40;
      margin-bottom: 4px;
    }
    .loading-sub {
      font-size: 14px;
      color: #555555;
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <div class="logo-badge">M</div>
    <div class="spinner"></div>
    <div class="loading-title">Martand Niwas Society</div>
    <div class="loading-sub">Loading Management Dashboard...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
